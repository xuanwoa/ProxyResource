# Egern 配置 —— 由 Loon 配置等价迁移
# 源文件: Tool/Loon/Lcf/zh-CN/Loon_Auto_Select_Config_By_iKeLee.lcf (模板作者: iKeLee / https://t.me/iKeLee)
# 迁移日期: 2026-11-06
# 本轮终极版修订 (2026-11-06): 私有网段由 bypass 改为规则直连; 补 default_proxy_group; 移除 WLOC
#
# 【导入后必做的两件事】
# 1. 把下方 policy_groups 里「机场节点池」的两个占位订阅链接, 换成你 Loon「远程代理」里的真实机场订阅链接
#    (原 Loon .lcf 文件里没有订阅链接, 是本地添加的, 必须手动抄过来; 只有一个机场就删掉多余的一行)
# 2. 在 Egern 里重新生成 MITM CA 证书并到系统设置里信任 (插件解密依赖它)
# 插件(模组)不在本文件内, 清单和加法见 Tool/Egern/README.md

# 配置文件自动更新: 指向本文件在 GitHub 上的地址, 仓库里改了 App 里自动同步
auto_update:
  url: https://raw.githubusercontent.com/xuanwoa/ProxyResource/main/Tool/Egern/Yaml/zh-CN/Egern_Auto_Select_Config_By_iKeLee.yaml
  interval: 86400

# 对应 Loon: ip-mode = v4-only, ipv6-vif = off
ipv6: false

# 对应 Loon: allow-wifi-access = false
allow_external_connections: false

# 对应 Loon: disconnect-on-policy-change = false
close_connections_on_policy_change: false

# 对应 Loon 的 geoip-url / ipasn-url (kelee 的 mmdb 数据库, Egern 同为 mmdb 格式)
geoip_db_url: https://geodata.kelee.one/Country-Masaiki.mmdb
asn_db_url: https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb

# 对应 Loon: proxy-test-url / internet-test-url
proxy_latency_test_url: http://www.gstatic.com/generate_204
direct_latency_test_url: http://connectivitycheck.platform.hicloud.com/generate_204

hijack_dns:
  - '*'

# 私有/保留网段不在这里绕过隧道, 改用 rules 顶部的 ip_cidr 规则直连 (借鉴官方默认配置):
# 流量先进 Egern 再被规则放行, 以后加 Tailscale 子网路由回家时, 在规则顶部插一条即可;
# 若放进 bypass, 流量根本不进 Egern, 内网穿透会断。
# 100.64.0.0/10 (Tailscale 的 CGNAT 网段) bypass 和直连规则里都不放, 完整留给内置 Tailscale。
bypass_tunnel_proxy:
  - '*.local'

real_ip_domains:
  - '*.local'
  - '*.lan'

dns:
  # 对应 Loon: dns-server = system
  bootstrap:
    - system

policy_groups:
  # 节点池: 对应 Loon 的 [Remote Proxy], 所有机场订阅合并成一个池子
  - external:
      name: 机场节点池
      type: select
      urls:
        # 换成真实订阅链接 (从 Loon 的远程代理里抄)
        - "https://example.com/机场A订阅链接"
        - "https://example.com/机场B订阅链接"
      filter: ".*"
      update_interval: 86400
  # 以下手动策略组与 Loon 一一对应: 组名不变, 过滤正则从原 [Remote Filter] 原样搬运
  # (原配置里各国 url-test 时延优选组在 Loon 中就是注释停用的, 这里同样不启用)
  - select:
      name: 全节点手动策略
      policies:
        - 机场节点池
      flatten: true
      filter: '^(?=.*(.))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
      icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png
  - select:
      name: 菲律宾手动策略
      policies:
        - 机场节点池
      flatten: true
      filter: '^(?=.*((?i)🇵🇭|菲律宾|马尼拉|宿务|PHL|MNL|Philippines|Manila|Cebu|(?<![A-Za-z])PH(?![A-Za-z])))(?!.*((?i)回国|校园|游戏|🎮|GAME)).*$'
  - select:
      name: 韩国手动策略
      policies:
        - 机场节点池
      flatten: true
      filter: '^(?=.*((?i)🇰🇷|韩国|韓|首尔|釜山|仁川|(\b(KR|KOR|Korea|Seoul)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
      icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png
  - select:
      name: 美国手动策略
      policies:
        - 机场节点池
      flatten: true
      filter: '^(?=.*((?i)🇺🇸|美国|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|波特兰|(\b(US|USA|United\s?States|America|Los\s?Angeles|San\s?Jose)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
      icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png
  - select:
      name: 英国手动策略
      policies:
        - 机场节点池
      flatten: true
      filter: '^(?=.*((?i)🇬🇧|英国|伦敦|曼彻斯特|(\b(UK|GB|GBR|United\s?Kingdom|Britain|London)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
      icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/UK.png
  - select:
      name: 德国手动策略
      policies:
        - 机场节点池
      flatten: true
      filter: '^(?=.*((?i)🇩🇪|德国|法兰克福|柏林|慕尼黑|(\b(DE|DEU|Germany|Frankfurt|Berlin)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
      icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/DE.png

# 在 App 里新加订阅时, 默认落进这个外部组
default_subscription_group: 机场节点池

# 在 App 里手动新加的单个节点, 默认落进这个组 (借鉴官方默认配置)
default_proxy_group: 全节点手动策略

rules:
  # 私有/保留网段直连 (对应 Loon 的 skip-proxy + bypass-tun, 改为规则形态; 与 LAN_SPLITTER 规则集互为兜底)
  # 以后若加「家里网段 -> Tailscale」的子网路由规则, 必须插到这一批的最上面
  - ip_cidr:
      match: 10.0.0.0/8
      policy: DIRECT
  - ip_cidr:
      match: 127.0.0.0/8
      policy: DIRECT
  - ip_cidr:
      match: 169.254.0.0/16
      policy: DIRECT
  - ip_cidr:
      match: 172.16.0.0/12
      policy: DIRECT
  - ip_cidr:
      match: 192.0.0.0/24
      policy: DIRECT
  - ip_cidr:
      match: 192.0.2.0/24
      policy: DIRECT
  - ip_cidr:
      match: 192.88.99.0/24
      policy: DIRECT
  - ip_cidr:
      match: 192.168.0.0/16
      policy: DIRECT
  - ip_cidr:
      match: 198.51.100.0/24
      policy: DIRECT
  - ip_cidr:
      match: 203.0.113.0/24
      policy: DIRECT
  - ip_cidr:
      match: 224.0.0.0/4
      policy: DIRECT
  - ip_cidr:
      match: 255.255.255.255/32
      policy: DIRECT
  # 远程规则与 Loon [Remote Rule] 一一对应, 顺序和策略绑定保持原样
  - rule_set:
      match: https://raw.githubusercontent.com/xuanwoa/ProxyResource/main/Tool/Loon/Rules/PH.lsr
      policy: 菲律宾手动策略
      update_interval: 86400
  - rule_set:
      match: https://kelee.one/Tool/Loon/Lsr/LAN_SPLITTER.lsr
      policy: DIRECT
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/AI%20Suite.list
      policy: 美国手动策略
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/xuanwoa/ProxyResource/main/Tool/Loon/Rules/UK.lsr
      policy: 英国手动策略
      update_interval: 86400
  # 个人定制: 小红书走英国, 别改错位
  - rule_set:
      match: https://raw.githubusercontent.com/xuanwoa/ProxyResource/main/Tool/Loon/Rules/XHS.lsr
      policy: 英国手动策略
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/xuanwoa/ProxyResource/main/Tool/Loon/Rules/DE.lsr
      policy: 德国手动策略
      update_interval: 86400
  - rule_set:
      match: https://raw.githubusercontent.com/xuanwoa/ProxyResource/main/Tool/Loon/Rules/US.lsr
      policy: 美国手动策略
      update_interval: 86400
  # 个人定制: HK 规则直连
  - rule_set:
      match: https://raw.githubusercontent.com/xuanwoa/ProxyResource/main/Tool/Loon/Rules/HK.lsr
      policy: DIRECT
      update_interval: 86400
  # (WLOC 规则集已于 2026-11-06 移除: WLOC 于 2026-11-04 被苹果证书固定封死)
  # 个人定制: Bybit 走韩国
  - rule_set:
      match: https://raw.githubusercontent.com/xuanwoa/ProxyResource/main/Tool/Loon/Rules/Bybit.lsr
      policy: 韩国手动策略
      update_interval: 86400
  # 对应 Loon 的 CN REGION 分流: 必须排在最后、FINAL 之前, 顺序不要动
  - rule_set:
      match: https://kelee.one/Tool/Loon/Lsr/REGION_SPLITTER.lsr
      policy: DIRECT
      update_interval: 86400
  # 对应 Loon 配置注释里的内置 GEOIP CN 直连
  - geoip:
      match: CN
      policy: DIRECT
      no_resolve: true
  # 对应 Loon: FINAL, 全节点手动策略
  - default:
      policy: 全节点手动策略
